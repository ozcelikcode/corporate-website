title: Privacy policy
description: How this website handles personal data, and your rights over it.
sections:
  - type: rich-text
    body: |
      ## What we collect

      This website does not use cookies or analytics. The only personal data we receive is what you type into the quote form: your name, email, company, role, country, the solutions you are interested in and your message.

      ## How we use it

      We use these details only to answer your request. We do not sell them or share them with third parties for marketing.

      ## Verification

      The quote form uses a privacy-friendly bot check to prevent abuse. It does not track you across sites.

      ## Retention

      Requests are kept in our mailbox for as long as needed to handle your enquiry, and for no more than twenty-four months afterwards.

      ## Your rights

      You may ask to see, correct or delete your data at any time by writing to the address on the contact page.
