name: Archive Search
slug: archive-search
tagline: Find any clip in seconds, not hours.
summary: Searchable media archive that indexes footage, transcripts and metadata, so producers can find and reuse material without calling the library.
category: Archive
cover: ../../../assets/uploads/cover-archive-search.png
coverAlt: A grid of thumbnails with one result circled by an amber magnifier
status: Beta
order: 3
sections:
  - type: feature-list
    label: Capabilities
    heading: What it does
    items:
      - title: Full-text and transcript search
        body: Search what was said, not just what was tagged, across years of footage.
      - title: Rights and expiry
        body: Usage rights travel with each asset, with warnings before restricted material goes to air.
      - title: Direct to edit
        body: Send a selected range to the editing system or the rundown in one step.
