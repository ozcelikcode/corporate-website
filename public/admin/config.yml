  - name: navigation
    label: Navigation
    folder: src/content/navigation
    create: false
    delete: false
    summary: Main navigation
    media_folder: src/assets/uploads
    public_folder: ../../../assets/uploads
    i18n: true
    fields:
      - name: header
        label: Header links
        widget: list
        min: 1
        i18n: true
        required: [en]
        fields:
          - { name: label, label: Label, widget: string }
          - name: href
            label: Link
            widget: string
            pattern:
              [
                '^(\/(?![\/\\])|https:\/\/|mailto:)',
                "Use a site path like /about/, an https:// URL or mailto:",
              ]
      - name: footer
        label: Footer links
        widget: list
        required: false
        i18n: true
        fields:
          - { name: label, label: Label, widget: string }
          - name: href
            label: Link
            widget: string
            pattern:
              [
                '^(\/(?![\/\\])|https:\/\/|mailto:)',
                "Use a site path like /about/, an https:// URL or mailto:",
              ]

  - name: pages
    label: Pages
    folder: src/content/pages
    slug:
      editable: [create]
    media_folder: src/assets/uploads
    public_folder: ../../../assets/uploads
    i18n: true
    fields:
      - { name: title, label: Title, widget: string, i18n: true, required: [en] }
      - name: description
        label: Description
        widget: string
        i18n: true
        required: [en]
        minlength: 1
        maxlength: 160
      - { name: ogImage, label: Social image, widget: image, i18n: true, required: false }
      - &sections
        name: sections
        label: Sections
        widget: list
        typeKey: type
        i18n: true
        required: [en]
        collapsed: auto
        types:
          - name: hero
            label: Hero
            fields:
              - &label { name: label, label: Label, widget: string, maxlength: 32 }
              - { name: headline, label: Headline, widget: string }
              - { name: headlineAccent, label: Headline accent, widget: string }
              - { name: lede, label: Lede, widget: text }
              - name: actions
                label: Actions
                widget: list
                required: false
                max: 2
                fields:
                  - { name: label, label: Label, widget: string, maxlength: 32 }
                  - name: href
                    label: Link
                    widget: string
                    pattern:
                      [
                        '^(\/(?![\/\\])|https:\/\/)',
                        "Use a site path like /quote/ or an https:// URL",
                      ]
              - { name: image, label: Image, widget: image }
              - { name: imageAlt, label: Image alt text, widget: string }
          - name: statement
            label: Statement
            fields:
              - *label
              - { name: text, label: Text, widget: text }
          - name: app-grid
            label: Application grid
            fields:
              - *label
              - { name: heading, label: Heading, widget: string }
              - name: apps
                label: Application slugs
                widget: list
                field: { name: slug, label: Slug, widget: string }
                required: false
                hint: Leave empty to show all applications, ordered by their order field.
          - name: feature-list
            label: Feature list
            fields:
              - *label
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Items
                widget: list
                min: 1
                max: 8
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Body, widget: text }
                  - name: duration
                    label: Duration
                    widget: string
                    required: false
                    hint: Rundown slot length shown beside the row, for display only.
                    pattern: ['^\d{2}:[0-5]\d:[0-5]\d$', "Use HH:MM:SS such as 00:00:30"]
          - name: rich-text
            label: Rich text
            fields:
              - { name: body, label: Body, widget: markdown }
          - name: cta
            label: Call to action
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - name: action
                label: Action
                widget: object
                fields:
                  - { name: label, label: Label, widget: string, maxlength: 32 }
                  - name: href
                    label: Link
                    widget: string
                    pattern:
                      [
                        '^(\/(?![\/\\])|https:\/\/)',
                        "Use a site path like /quote/ or an https:// URL",
                      ]
          - name: faq
            label: FAQ
            fields:
              - *label
              - name: items
                label: Questions
                widget: list
                min: 1
                fields:
                  - { name: q, label: Question, widget: string }
                  - { name: a, label: Answer, widget: markdown }

  - name: applications
    label: Applications
    folder: src/content/applications
    slug: "{{fields.slug}}"
    identifier_field: name
    sortable_fields: [order, name]
    media_folder: src/assets/uploads
    public_folder: ../../../assets/uploads
    i18n: true
    fields:
      - { name: name, label: Name, widget: string, i18n: true, required: [en] }
      - name: slug
        label: Slug
        widget: string
        hint: Must equal the file name and must not be changed after creation (the CMS has no read-only-after-create option).
        i18n: duplicate
        pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "Lowercase letters, digits and single hyphens only"]
      - name: tagline
        label: Tagline
        widget: string
        i18n: true
        required: [en]
        maxlength: 120
      - { name: summary, label: Summary, widget: text, i18n: true, required: [en] }
      - { name: category, label: Category, widget: string, i18n: true, required: [en] }
      - { name: cover, label: Cover image, widget: image, i18n: true, required: [en] }
      - { name: coverAlt, label: Cover alt text, widget: string, i18n: true, required: [en] }
      - name: status
        label: Status
        widget: string
        i18n: true
        required: [en]
        maxlength: 32
      - name: order
        label: Order
        widget: number
        value_type: int
        min: 0
        i18n: duplicate
      - name: links
        label: Links
        widget: list
        i18n: true
        required: false
        fields:
          - { name: label, label: Label, widget: string, maxlength: 32 }
          - name: href
            label: Link
            widget: string
            pattern:
              ['^(\/(?![\/\\])|https:\/\/)', "Use a site path like /quote/ or an https:// URL"]
      - name: brochure
        label: Brochure URL
        widget: string
        i18n: true
        required: false
        hint: Public https URL of the PDF (large files live in R2, not in the repo).
        pattern: ['^https:\/\/\S+$', "Start with https://"]
      - *sections
