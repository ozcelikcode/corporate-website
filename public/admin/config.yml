# Sveltia CMS config. Mirrors the Zod schemas in src/content.config.ts and
# src/lib/sections-schema.ts (all strict objects): field names, limits and href
# patterns must stay in sync with them. Verified against sveltiacms.app docs.

backend:
  name: github
  repo: "<owner>/<repo>" # replace once with the real GitHub repository
  branch: main
  base_url: https://auth-worker.example.workers.dev # replace with the sveltia-cms-auth Worker URL (runbook step)

# Editors submit a branch + PR per entry; only users who can merge to main publish.
publish_mode: editorial_workflow

media_folder: src/assets/uploads
public_folder: ../../assets/uploads

i18n:
  structure: multiple_folders
  locales: [en, tr]
  default_locale: en

singletons:
  - name: settings
    label: Site settings
    file: src/content/settings/site.yaml
    icon: settings
    # Not localised: no field below sets i18n, so the file is shared by all locales.
    media_folder: src/assets/uploads
    public_folder: ../../assets/uploads
    fields:
      - { name: brandName, label: Brand name, widget: string }
      - { name: logo, label: Logo, widget: image }
      - { name: logoAlt, label: Logo alt text, widget: string }
      - name: accent
        label: Accent colour
        widget: string
        hint: 6-digit hex such as #ffb000. Needs at least 3:1 contrast on the dark canvas; the build fails otherwise and names this field.
        pattern: ["^#[0-9a-fA-F]{6}$", "Use a 6-digit hex colour such as #ffb000"]
      - name: contacts
        label: Contacts
        widget: list
        min: 1
        hint: At least one entry must have kind "email".
        fields:
          - name: kind
            label: Kind
            widget: select
            options: [email, phone, address]
          - { name: value, label: Value, widget: string }
          - name: href
            label: Link
            widget: string
            pattern: ['^(mailto:|tel:|https:\/\/)', "Start with mailto:, tel: or https://"]
      - name: socials
        label: Social links
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - name: href
            label: Link
            widget: string
            pattern: ['^https:\/\/', "Start with https://"]
      - { name: ogImage, label: Default social image, widget: image }
      - name: organization
        label: Organisation
        widget: object
        fields:
          - { name: legalName, label: Legal name, widget: string }
          - name: url
            label: Website URL
            widget: string
            pattern: ['^https?:\/\/\S+$', "Enter a full URL such as https://example.com"]
          - { name: address, label: Address, widget: string, required: false }

collections:
  - name: ui
    label: Interface strings
    folder: src/content/ui
    create: false
    delete: false
    summary: Interface strings
    media_folder: src/assets/uploads
